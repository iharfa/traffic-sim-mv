<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Traffic Sim MV</title>
<meta name="description" content="Live traffic microsimulation of the Greater Malé Region on Hulhumalé's real HDC road network — tune vehicle numbers by type, add pedestrians, mark one-way streets and place traffic signals.">
<meta property="og:title" content="Traffic Sim MV">
<meta property="og:description" content="Live traffic microsimulation of the Greater Malé Region. Motorcycles, cars and buses flow through Hulhumalé's real HDC road network — tune the traffic, mark one-way streets, place signals.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://traffic-sim-mv.vercel.app/">
<meta property="og:image" content="https://traffic-sim-mv.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Traffic Sim MV">
<meta name="twitter:description" content="Live traffic microsimulation of the Greater Malé Region on Hulhumalé's real HDC road network.">
<meta name="twitter:image" content="https://traffic-sim-mv.vercel.app/og.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛵</text></svg>">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root { --bg:#0d1117; --panel:#161b22cc; --line:#2d333b; --fg:#e6edf3; --dim:#8b949e; --acc:#4cc9f0; }
  * { box-sizing:border-box; margin:0 }
  html,body { height:100% }
  body { font:13px/1.45 system-ui,'Segoe UI',sans-serif; background:var(--bg); color:var(--fg); overflow:hidden }
  #map { position:absolute; inset:0 }
  #overlay { position:absolute; inset:0; width:100%; height:100%; pointer-events:none }
  #panel { position:absolute; top:10px; left:10px; width:264px; max-height:calc(100% - 20px); overflow-y:auto;
           background:var(--panel); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:12px; padding:14px; z-index:5 }
  #panel h1 { font-size:15px; letter-spacing:.3px }
  #panel .sub { color:var(--dim); font-size:11px; margin-bottom:10px }
  .tabs { display:flex; gap:6px; margin-bottom:10px }
  .tabs button { flex:1; padding:5px 0; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--fg); cursor:pointer; font-size:12px }
  .tabs button.on { background:var(--acc); border-color:var(--acc); color:#04121a; font-weight:600 }
  .tabs button:disabled { opacity:.4; cursor:not-allowed }
  .row { display:flex; align-items:center; gap:8px; margin:4px 0 }
  .row label { flex:1; display:flex; align-items:center; gap:7px; cursor:pointer }
  .sw { width:10px; height:10px; border-radius:3px; flex:none }
  .row input[type=range] { width:96px; accent-color:var(--acc) }
  .row .n { width:34px; text-align:right; font-variant-numeric:tabular-nums; color:var(--dim); font-size:12px }
  .sec { margin-top:12px; padding-top:9px; border-top:1px solid var(--line) }
  .sec h2 { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); margin-bottom:6px }
  .ctrls { display:flex; gap:6px; align-items:center }
  .ctrls button, .sec select { background:#21262d; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:5px 10px; cursor:pointer; font-size:12px }
  .ctrls button.on { background:var(--acc); color:#04121a; border-color:var(--acc); font-weight:600 }
  #play { width:36px; font-size:14px }
  .sec select { width:100% }
  .hint { color:var(--dim); font-size:11px; margin-top:5px }
  #siglist div { display:flex; justify-content:space-between; align-items:center; padding:3px 0; font-size:12px; color:var(--dim) }
  #siglist button { background:none; border:none; color:#e63946; cursor:pointer; font-size:13px }
  #stats { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); background:var(--panel); backdrop-filter:blur(10px);
           border:1px solid var(--line); border-radius:10px; padding:6px 16px; font-size:12px; color:var(--fg); z-index:5;
           font-variant-numeric:tabular-nums; white-space:nowrap }
  #stats b { color:var(--acc) }
  #collapse { position:absolute; top:6px; right:8px; background:none; border:none; color:var(--dim); cursor:pointer; font-size:14px }
  #panel.min > :not(h1):not(#collapse) { display:none }
  #pop { position:absolute; z-index:6; width:210px; background:var(--panel); backdrop-filter:blur(10px);
         border:1px solid var(--line); border-radius:10px; padding:10px; font-size:12px }
  #pop select { background:#21262d; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:3px 6px }
  #pop .ctrls { margin-top:6px }
  @media (max-width:600px){ #panel { width:calc(100% - 20px) } }
</style>
</head>
<body>
<div id="map"></div>
<canvas id="overlay"></canvas>

<div id="panel">
  <button id="collapse" title="Collapse">▾</button>
  <h1>Traffic Sim MV</h1>
  <div class="sub">Greater Malé Region · live microsimulation</div>

  <div class="tabs">
    <button class="on">Hulhumalé P1+P2</button>
    <button disabled title="Map source pending — coming soon">Malé</button>
  </div>

  <div class="ctrls">
    <button id="play" class="on">⏸</button>
    <button data-spd="1" class="spd on">1×</button>
    <button data-spd="2" class="spd">2×</button>
    <button data-spd="4" class="spd">4×</button>
    <button data-spd="8" class="spd">8×</button>
  </div>

  <div class="sec">
    <h2>Traffic volume</h2>
    <div class="row"><label>Density</label><input type="range" id="mult" min="0" max="500" value="100"><span class="n" id="multn">100%</span></div>
    <div id="types"></div>
    <div class="row"><label><span class="sw" style="background:#fff"></span>Pedestrians</label>
      <input type="range" id="peds" min="0" max="4000" value="200"><span class="n" id="pedsn">200</span></div>
  </div>

  <div class="sec">
    <h2>Traffic signals</h2>
    <div class="ctrls"><button id="addsig">＋ Add signal</button></div>
    <div class="hint" id="sighint">Click the button, then click a junction on the map.</div>
    <div id="siglist"></div>
  </div>

  <div class="sec">
    <h2>Roads</h2>
    <div class="ctrls"><button id="editroads">✏️ Edit roads</button><button id="exportovr" title="Download your direction/lane edits as overrides.json">⬇ Edits</button></div>
    <div class="hint">In edit mode, click a road to set its direction and lane count. Arrows mark one-way streets.</div>
  </div>

  <div class="sec">
    <h2>Basemap</h2>
    <select id="basemap">
      <option value="esri">Esri World Imagery</option>
      <option value="hdc">HDC Drone Ortho (Nov 2025)</option>
      <option value="osm">OpenStreetMap</option>
    </select>
    <div class="row" style="margin-top:6px"><label><input type="checkbox" id="roads" checked> Road network overlay</label></div>
  </div>
</div>

<div id="pop" hidden></div>
<div id="stats">loading network…</div>
<script type="module" src="app.js"></script>
</body>
</html>
